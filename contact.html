<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Sonia Nardinocchi</title>
<meta name="description" content="Get in touch with Sonia Nardinocchi — global marketer, influencer marketing and campaign activations, Seoul.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<script>document.documentElement.className+=" js";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>


<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="index.html">Sonia Nardinocchi</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="index.html">home</a>
      <a href="about.html">About Me</a>
      <a href="portfolio.html">portfolio</a>
      <a href="contact.html" aria-current="page">contact</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="section">
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1 class="display" style="max-width:26ch;font-size:clamp(1.8rem, 4vw, 3.1rem)">Send me an email at <a class="contact-mail" href="mailto:nardinocchisonia@gmail.com" style="font-size:inherit;font-weight:inherit;letter-spacing:inherit">nardinocchisonia@gmail.com</a> or fill out the form down below</h1>

    </div>
  </section>

  <section class="section section--sink" style="padding-top:clamp(1.5rem,3vw,2.5rem)">
    <div class="wrap split">

      <form class="form reveal" action="https://formspree.io/f/xyeypovq" method="post" data-mailto="nardinocchisonia@gmail.com">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div>
          <button class="btn btn--gold" type="submit">Send</button>
        </div>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>

    </div>
  </section>

  <section class="section--tight">
    <div class="wrap center" style="padding-block:clamp(3rem,7vw,5rem)">
      <hr class="rule--gold is-centered">
      <p class="muted" style="letter-spacing:.2em;text-transform:uppercase;font-size:.74rem">
        Based in Seoul · Working globally
      </p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="site-footer__name">Sonia Nardinocchi</p>
    <div class="site-footer__bar">
      <span>&copy; <span data-year>2026</span> Sonia Nardinocchi</span>
      <span>Seoul, South Korea</span>
      <a href="mailto:nardinocchisonia@gmail.com">nardinocchisonia@gmail.com</a>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
